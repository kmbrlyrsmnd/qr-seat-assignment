<!DOCTYPE html>
<html>
<head>
 <title>Enter Name</title>
 <style>
  body {
    background-color: #e0e0e0; /* Light gray background */
    font-family: 'Arial', sans-serif;
    color: #333; /* Dark gray text */
    text-align: center;
  }
  h2 {
    color: #7d7d7d; /* Medium gray for heading */
  }
  #nameForm {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #a9a9a9; /* Darker gray border */
    background-color: white; /* White background for form */
    display: inline-block;
    border-radius: 10px; /* Rounded corners */
  }
  input[type="text"] {
    padding: 10px;
    border: 1px solid #a9a9a9; /* Darker gray border for input */
    border-radius: 5px; /* Rounded corners for input */
    width: 200px; /* Fixed width */
    margin-right: 10px; /* Space between input and button */
  }
  button {
    padding: 10px;
    background-color: #7d7d7d; /* Medium gray button */
    color: white; /* White text on button */
    border: none; /* No border */
    border-radius: 5px; /* Rounded corners for button */
    cursor: pointer; /* Pointer cursor on hover */
  }
  button:hover {
    background-color: #6a6a6a; /* Darker gray on hover */
  }
  #seatResult {
    margin-top: 20px;
    font-size: 18px; /* Larger font for the result */
    color: #555; /* Medium gray text for result */
  }
 </style>
</head>
<body>
 <h2>Enter Your Name</h2>
 <form id="nameForm">
  <input type="text" id="nameInput" required placeholder="Your Name">
  <button type="submit">Get Seat Number</button>
 </form>
 <p id="seatResult"></p>

 <script>
  const seatMap = {
    "Alice": "A1",
    "Bob": "B2",
    "Charlie": "C3"
  };

  document.getElementById("nameForm").onsubmit = function(e) {
    e.preventDefault();
    const name = document.getElementById("nameInput").value.trim();
    const seat = seatMap[name] || "Seat not found";
    document.getElementById("seatResult").textContent = `Your seat: ${seat}`;
  };
 </script>
</body>
</html>
