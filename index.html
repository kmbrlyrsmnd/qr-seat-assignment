<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR</title>
    <style>
        body {
            background-color: #f0f0f0; /* Light gray background */
            font-family: 'Arial', sans-serif;
            color: #333; /* Dark gray text */
            text-align: center;
            margin: 0; /* Remove default margin */
            padding: 50px 0; /* Top and bottom padding */
        }

        h1 {
            color: #7d7d7d; /* Medium gray for heading */
            margin-bottom: 20px; /* Space below the heading */
            font-size: 1.5em; /* Slightly smaller heading */
        }

        #qrContainer {
            background-color: #f5f5dc; /* Beige background for QR container */
            padding: 15px; /* Padding around the QR code */
            border-radius: 10px; /* Rounded corners */
            display: inline-block; /* Center container */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }

        img {
            max-width: 100px; /* Further reduce maximum width for QR code */
            height: auto; /* Maintain aspect ratio */
            display: block; /* Center the image */
            margin: 0 auto; /* Center the image horizontally */
        }
    </style>
</head>
<body>
    <h1>Scan this QR code to get your seat number</h1>
    <div id="qrContainer">
        <img src="qr.png" alt="QR Code">
    </div>
</body>
</html>
